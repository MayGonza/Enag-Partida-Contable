<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/logo.ico" type="image/x-icon">
    <title>Bitácora Global del Sistema - TI</title>
    <style>
        :root {
            --primary: #002147;
            --primary-light: #003470;
            --bg-body: #002147;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-body);
            color: var(--text-color);
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('../assets/logo.jpeg') no-repeat center center;
            background-size: 40%;
            filter: blur(10px) opacity(0.15);
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-top: 8px solid var(--primary);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
        }

        .btn-nav {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            background: #6c757d;
            color: white;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #cbd5e1;
            padding: 12px;
            text-align: left;
            font-size: 0.85em;
        }

        th {
            background: #f8fafc;
            color: var(--primary);
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.8em;
        }

        .badge-login {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-create {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-update {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-default {
            background: #f3f4f6;
            color: #374151;
        }
    </style>
</head>

<body>
    <div class="nav-container">
        <a href="login.html" class="btn-nav" id="btnCerrarSesion" onclick="cerrarSesion(event)">← Cerrar Sesión</a>
    </div>

    <div class="container">
        <h1>🛡️ Bitácora Global del Sistema</h1>
        <p style="text-align: center; color: #64748b; margin-top: -20px; margin-bottom: 30px;">Auditoría General de TI -
            Registro de todas las acciones del sistema</p>

        <div style="margin-bottom: 20px; display: flex; gap: 10px; justify-content: flex-end;">
            <label for="filtroFecha" style="font-size: 0.9em; white-space: nowrap; margin: 0; align-self: center;">Filtrar por fecha (DD/MM/YYYY):</label>
            <input type="text" id="filtroFecha" placeholder="DD/MM/YYYY" maxlength="10" oninput="filtrarBitacora()" style="padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; width: 120px; font-size: 0.9em; outline: none;">
            <button type="button" onclick="limpiarFiltroFechaBitacora()" title="Limpiar fecha" style="padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; cursor: pointer; font-size: 0.85em;">✕</button>

            <input type="text" id="filtroBitacora" placeholder="Filtrar por módulo, usuario, acción..."
                oninput="filtrarBitacora()"
                style="padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; width: 350px; font-size: 0.9em; outline: none;">
        </div>

        <table id="bitacoraTable">
            <thead>
                <tr>
                    <th style="width: 15%">Fecha y Hora</th>
                    <th style="width: 15%">Usuario</th>
                    <th style="width: 15%">Módulo</th>
                    <th style="width: 15%">Acción</th>
                    <th style="width: 40%">Detalles</th>
                </tr>
            </thead>
            <tbody id="bitacoraBody">
                <tr>
                    <td colspan="5" style="text-align: center;">Cargando registros de auditoría...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>

    <script>
        async function cerrarSesion(e) {
            e.preventDefault();
            if (window.registrarBitacora) {
                await window.registrarBitacora('Autenticación', 'Cerrar Sesión', 'El usuario ha cerrado su sesión en el sistema.');
            }
            firebase.auth().signOut().then(() => {
                window.location.href = 'login.html';
            });
        }

        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const doc = await dbFirestore.collection('usuarios').doc(user.uid).get();
                    if (doc.exists) {
                        const userData = doc.data();
                        if (userData.departamento !== 'ti' && userData.departamento !== 'direccion') {
                            alert("Acceso denegado: Solo el departamento de TI puede ver esta bitácora.");
                            window.location.href = '../index.html';
                            return;
                        }
                        cargarBitacora();
                    }
                } catch (e) {
                    console.error("Error validando usuario", e);
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        function formatTimestamp(timestamp) {
            if (!timestamp) return 'Fecha desconocida';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleString('es-HN', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
            });
        }

        function getBadgeClass(accion) {
            const acc = (accion || '').toLowerCase();
            if (acc.includes('inicio de sesión') || acc.includes('login')) return 'badge-login';
            if (acc.includes('crear') || acc.includes('nueva')) return 'badge-create';
            if (acc.includes('actualizar') || acc.includes('modificar') || acc.includes('cambiar')) return 'badge-update';
            if (acc.includes('eliminar') || acc.includes('borrar')) return 'badge-delete';
            return 'badge-default';
        }

        let bitacoraData = [];

        function cargarBitacora() {
            dbFirestore.collection('bitacora_global').orderBy('timestamp', 'desc').limit(500).onSnapshot((snapshot) => {
                const tbody = document.getElementById('bitacoraBody');

                if (snapshot.empty) {
                    bitacoraData = [];
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No hay registros en la bitácora global.</td></tr>';
                    return;
                }

                bitacoraData = [];
                snapshot.forEach(doc => {
                    bitacoraData.push(doc.data());
                });

                filtrarBitacora();
            }, (error) => {
                console.error("Error cargando bitácora:", error);
                document.getElementById('bitacoraBody').innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Error al cargar la bitácora. Verifique las reglas de Firestore.</td></tr>';
            });
        }

        function limpiarFiltroFechaBitacora() {
            const input = document.getElementById('filtroFecha');
            if (input) input.value = '';
            filtrarBitacora();
        }

        function filtrarBitacora() {
            const query = (document.getElementById('filtroBitacora')?.value || '').toLowerCase().trim();
            const fechaFiltro = (document.getElementById('filtroFecha')?.value || '').trim();
            const tbody = document.getElementById('bitacoraBody');
            tbody.innerHTML = '';

            const filtrados = bitacoraData.filter(b => {
                const usuario = (b.usuario || '').toLowerCase();
                const modulo = (b.modulo || '').toLowerCase();
                const accion = (b.accion || '').toLowerCase();
                const detalles = (b.detalles || '').toLowerCase();

                const coincideTexto = usuario.includes(query) || modulo.includes(query) || accion.includes(query) || detalles.includes(query);
                
                let coincideFecha = true;
                if (fechaFiltro && b.timestamp) {
                    const dateObj = b.timestamp.toDate ? b.timestamp.toDate() : new Date(b.timestamp);
                    const dia = String(dateObj.getDate()).padStart(2, '0');
                    const mes = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const anio = dateObj.getFullYear();
                    const fechaRow = `${dia}/${mes}/${anio}`;
                    // Permite coincidencias parciales a medida que se escribe (ej. 12/03)
                    coincideFecha = fechaRow.startsWith(fechaFiltro);
                }

                return coincideTexto && coincideFecha;
            });

            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No se encontraron resultados para la búsqueda.</td></tr>';
                return;
            }

            filtrados.forEach(b => {
                const tr = document.createElement('tr');

                const fechaTxt = formatTimestamp(b.timestamp);
                const usuario = b.usuario || 'Desconocido';
                const modulo = b.modulo || 'Sistema';
                const accion = b.accion || 'Acción';
                const detalles = b.detalles || '';

                tr.innerHTML = `
                    <td>${fechaTxt}</td>
                    <td style="font-weight: bold; color: var(--primary);">${usuario}</td>
                    <td>${modulo}</td>
                    <td style="text-align: center;"><span class="badge ${getBadgeClass(accion)}">${accion}</span></td>
                    <td>${detalles}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>

</html>
