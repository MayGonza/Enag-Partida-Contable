<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Módulo de Comercialización — ENAG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .maintenance-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        h1 {
            color: #002147;
            margin-top: 0;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-back {
            display: inline-block;
            text-decoration: none;
            background: #002147;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: #003470;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <div class="maintenance-container">
        <div class="icon">🛠️</div>
        <h1>Módulo de Comercialización</h1>
        <p>Esta sección se encuentra temporalmente deshabilitada por mantenimiento y actualizaciones programadas.</p>
        <a href="../index.html" class="btn-back">← Volver al Portal</a>
    </div>
    <script src="../js/soporte.js"></script>
</body>

</html>
