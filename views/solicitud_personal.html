<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/logo.ico" type="image/x-icon">
    <title>Solicitud de Personal — ENAG</title>
    <!-- Import Google Fonts: Outfit and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #002147;
            --primary-light: #003470;
            --accent: #d97706;
            --accent-hover: #b45309;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-panel: rgba(255, 255, 255, 0.95);
            --border-color: rgba(226, 232, 240, 0.8);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        /* Ambient backgrounds */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('../assets/logo.jpeg') no-repeat center center;
            background-size: cover;
            filter: blur(15px) opacity(0.05);
            z-index: -2;
            position: fixed;
        }

        .form-card {
            width: 100%;
            max-width: 800px;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 33, 71, 0.08);
            z-index: 10;
            box-sizing: border-box;
            border-top: 6px solid var(--primary);
            animation: card-appear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes card-appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-container {
            text-align: center;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e2e8f0;
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            color: var(--primary);
            margin: 0 0 5px 0;
            font-size: 1.8em;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95em;
            margin: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group-full {
            grid-column: 1 / -1;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #ffffff;
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 33, 71, 0.1);
        }

        .radio-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .radio-item {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-item input {
            margin-right: 8px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 33, 71, 0.2);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert-banner {
            display: none;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #15803d;
            border-color: #bbf7d0;
        }

        .info-box {
            background-color: #e0f2fe;
            border-left: 4px solid #0ea5e9;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #0369a1;
            border-radius: 4px 8px 8px 4px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">
        <div class="header-container">
            <h2>Formato Único de Solicitud de Personal</h2>
            <p class="subtitle">Departamento de Recursos Humanos - ENAG</p>
        </div>

        <div class="info-box">
            <strong>Importante:</strong> Toda solicitud debe presentarse con al menos 2 días de anticipación, salvo
            casos de emergencia debidamente justificados.
        </div>

        <div id="alertBanner" class="alert-banner">
            <span id="alertMessage"></span>
        </div>

        <form id="solicitudForm" onsubmit="enviarSolicitud(event)">

            <div class="form-grid">

                <div class="form-group">
                    <label class="form-label">Fecha de Inicio *</label>
                    <input type="date" id="fechaInicio" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Fecha de finalización (si aplica)</label>
                    <input type="date" id="fechaFin" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Hora de salida (si aplica)</label>
                    <input type="time" id="horaSalida" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Hora de retorno (si aplica)</label>
                    <input type="time" id="horaRetorno" class="form-input">
                </div>

                <div class="form-group form-group-full">
                    <label class="form-label">Marque la Solicitud que corresponda *</label>
                    <div class="radio-group">
                        <label class="radio-item"><input type="radio" name="tipoSolicitud"
                                value="Constancia laboral/Boucher" required> Constancia laboral/Boucher</label>
                        <label class="radio-item"><input type="radio" name="tipoSolicitud" value="Permiso personal">
                            Permiso personal</label>
                        <label class="radio-item"><input type="radio" name="tipoSolicitud" value="Permiso de trabajo">
                            Permiso de trabajo</label>
                        <label class="radio-item"><input type="radio" name="tipoSolicitud" value="Incapacidad">
                            Incapacidad</label>
                        <label class="radio-item"><input type="radio" name="tipoSolicitud" value="Vacaciones">
                            Vacaciones</label>
                        <label class="radio-item"><input type="radio" name="tipoSolicitud"
                                value="Justificación de ausencia"> Justificación de ausencia</label>
                        <label class="radio-item"><input type="radio" name="tipoSolicitud" value="Otros"> Otros</label>
                    </div>
                </div>

                <div class="form-group form-group-full">
                    <label class="form-label">Describa de forma clara su solicitud *</label>
                    <textarea id="descripcion" class="form-textarea"
                        placeholder="Escriba los detalles de su solicitud aquí..." required></textarea>
                </div>

                <div class="form-group form-group-full" style="margin-top: 15px;">
                    <h3
                        style="font-size: 1.1em; color: var(--primary); margin-bottom: 5px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px;">
                        Identificación del Empleado</h3>
                </div>

                <div class="form-group">
                    <label class="form-label">Nombre Completo *</label>
                    <input type="text" id="nombre" class="form-input" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Oficina / Departamento *</label>
                    <select id="departamento" class="form-select" required>
                        <option value="" disabled selected>Seleccione...</option>
                        <option value="Contabilidad">Contabilidad</option>
                        <option value="Recursos Humanos">Recursos Humanos</option>
                        <option value="Producción / Talleres">Producción / Talleres Gráficos</option>
                        <option value="Comercialización">Comercialización / Ventas</option>
                        <option value="TI">Tecnología de la Información (TI)</option>
                        <option value="Dirección">Dirección / Administración</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">No. de Puesto (opcional)</label>
                    <input type="text" id="noPuesto" class="form-input" placeholder="Opcional">
                </div>

                <div class="form-group">
                    <label class="form-label">Puesto *</label>
                    <input type="text" id="puesto" class="form-input" placeholder="Ej. Asistente Administrativo"
                        required>
                </div>

            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span>Enviar Solicitud a RRHH</span>
            </button>
        </form>
    </div>

    <!-- Firebase SDK Compat v10 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>

    <script>
        async function enviarSolicitud(event) {
            event.preventDefault();

            const btn = document.getElementById('submitBtn');
            const banner = document.getElementById('alertBanner');
            const message = document.getElementById('alertMessage');

            btn.disabled = true;
            btn.querySelector('span').innerText = 'Enviando...';
            banner.style.display = 'none';
            banner.classList.remove('alert-success');

            try {
                // Obtener valores
                const fechaInicio = document.getElementById('fechaInicio').value;
                const fechaFin = document.getElementById('fechaFin').value;
                const horaSalida = document.getElementById('horaSalida').value;
                const horaRetorno = document.getElementById('horaRetorno').value;

                const tipoSolicitudNode = document.querySelector('input[name="tipoSolicitud"]:checked');
                const tipoSolicitud = tipoSolicitudNode ? tipoSolicitudNode.value : '';

                const descripcion = document.getElementById('descripcion').value.trim();
                const nombre = document.getElementById('nombre').value.trim();
                const departamento = document.getElementById('departamento').value;
                const noPuesto = document.getElementById('noPuesto').value.trim();
                const puesto = document.getElementById('puesto').value.trim();

                const solicitud = {
                    fechaInicio,
                    fechaFin,
                    horaSalida,
                    horaRetorno,
                    tipoSolicitud,
                    descripcion,
                    nombre,
                    departamento,
                    noPuesto,
                    puesto,
                    estado: 'Pendiente', // Resolución de RRHH por defecto
                    observacionesRRHH: '',
                    fechaCreacion: firebase.firestore.FieldValue.serverTimestamp()
                };

                await dbFirestore.collection('solicitudes_personal').add(solicitud);

                banner.classList.add('alert-success');
                banner.style.display = 'flex';
                message.innerText = '✅ Su solicitud ha sido enviada exitosamente a Recursos Humanos.';

                document.getElementById('solicitudForm').reset();
            } catch (error) {
                console.error("Error al enviar solicitud:", error);
                banner.style.display = 'flex';
                message.innerText = '⚠️ Error al enviar: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.querySelector('span').innerText = 'Enviar Solicitud a RRHH';
            }
        }
    </script>
</body>

</html>
