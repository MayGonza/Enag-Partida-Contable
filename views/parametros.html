<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/logo.ico" type="image/x-icon">
    <title>Parámetros del Sistema - TI</title>
    <style>
        :root {
            --primary: #002147;
            --primary-light: #003470;
            --bg-body: #002147;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-body);
            color: var(--text-color);
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('../assets/logo.jpeg') no-repeat center center;
            background-size: 40%;
            filter: blur(10px) opacity(0.15);
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-top: 8px solid var(--primary);
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
        }

        .btn-nav {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            background: #6c757d;
            color: white;
            transition: all 0.3s;
        }

        .btn-nav:hover {
            background-color: #5a6268;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
        }

        .param-card {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .param-card h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .form-group input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            width: 100%;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 33, 71, 0.1);
        }

        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-save:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .helper-text {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="nav-container">
        <a href="../index.html" class="btn-nav">← Volver al Menú Principal</a>
        <a href="login.html" class="btn-nav" id="btnCerrarSesion" onclick="cerrarSesion(event)">← Cerrar Sesión</a>
    </div>

    <div class="container">
        <h1>⚙️ Parámetros del Sistema</h1>
        <p style="text-align: center; color: #64748b; margin-top: -20px; margin-bottom: 30px;">Administración de configuraciones globales - Solo TI</p>

        <div class="param-card">
            <h2>Gestión de Sesiones</h2>
            <div class="form-group">
                <label for="paramInactividad">Tiempo de Inactividad (Minutos)</label>
                <input type="number" id="paramInactividad" min="1" value="5" placeholder="Ej: 5">
                <div class="helper-text">Los usuarios serán desconectados automáticamente si no interactúan con el sistema durante esta cantidad de minutos.</div>
            </div>
            
            <button type="button" class="btn-save" onclick="guardarParametros()">Guardar Cambios</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>

    <script>
        async function cerrarSesion(e) {
            e.preventDefault();
            if (window.registrarBitacora) {
                await window.registrarBitacora('Autenticación', 'Cerrar Sesión', 'El usuario ha cerrado su sesión en el sistema.');
            }
            firebase.auth().signOut().then(() => {
                window.location.href = 'login.html';
            });
        }

        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const doc = await dbFirestore.collection('usuarios').doc(user.uid).get();
                    if (doc.exists) {
                        const userData = doc.data();
                        if (userData.departamento !== 'ti' && userData.departamento !== 'direccion') {
                            alert("Acceso denegado: Solo el departamento de TI puede ver esta configuración.");
                            window.location.href = '../index.html';
                            return;
                        }
                        cargarParametros();
                    }
                } catch (e) {
                    console.error("Error validando usuario", e);
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        function cargarParametros() {
            dbFirestore.collection('parametros').doc('sistema').onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.tiempoInactividad) {
                        document.getElementById('paramInactividad').value = data.tiempoInactividad;
                    }
                }
            });
        }

        async function guardarParametros() {
            const min = parseInt(document.getElementById('paramInactividad').value, 10);
            if (!min || min < 1) {
                alert("Por favor ingrese un tiempo válido (mínimo 1 minuto).");
                return;
            }
            try {
                await dbFirestore.collection('parametros').doc('sistema').set({
                    tiempoInactividad: min,
                    actualizadoPor: firebase.auth().currentUser.email,
                    actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                if (window.registrarBitacora) {
                    window.registrarBitacora('Configuración', 'Actualizar Parámetros', `Se cambió el tiempo de inactividad a ${min} minutos.`);
                }
                alert("Parámetros actualizados exitosamente.");
            } catch (e) {
                console.error("Error guardando parámetros:", e);
                alert("Hubo un error al guardar los parámetros.");
            }
        }
    </script>
</body>
</html>
