<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.ico" type="image/x-icon">
    <title>Nueva Partida Contable</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            background-color: #e9ecef;
            min-height: 100vh;
        }
        /* Fondo difuminado con el logo */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('logo.jpeg') no-repeat center center;
            background-size: 50%;
            filter: blur(15px) opacity(0.08); /* Ajustado para que se note sutilmente sin ocultar el contenido */
            z-index: -1;
        }
        .container { 
            max-width: 950px; 
            width: 95%; /* Hace el contenedor más flexible */
            margin: auto;
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        .form-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }
        .form-header img {
            max-width: 100%; /* Hace el logo responsivo */
            height: auto; /* Mantiene la relación de aspecto */
            margin-bottom: 15px;
        }
        h2 { color: #2c3e50; margin: 0; font-size: 1.5em; text-transform: uppercase; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .table-responsive { /* Contenedor para hacer la tabla scrollable horizontalmente */
            overflow-x: auto;
        }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        table { min-width: 600px; /* Asegura que la tabla no se comprima demasiado */ }
        th { background-color: #f8f9fa; }
        .actions { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-submit { background-color: #007bff; color: white; font-size: 16px; }
        .btn-remove { background-color: #dc3545; color: white; padding: 5px 10px; }
        .totals { font-weight: bold; font-size: 1.1em; }
        .error { color: red; margin-top: 10px; }
        .currency-field { display: flex; align-items: center; gap: 4px; }
        .currency-field span { font-weight: bold; color: #555; } /* Estilo para el símbolo de moneda */
        input.cuenta, input.descripcion { font-weight: bold; } /* Todo lo que se escriba en cuenta y descripción en negrita */
        .tax-options { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; /* Permite que las opciones de impuesto se envuelvan */ }
        .tax-options input[type="radio"] { width: 16px; height: 16px; cursor: pointer; vertical-align: middle; } /* Radio botones más pequeños */
        .fixed-row input { font-weight: bold; } /* La fila del banco mantiene su negrita específica */
        .tax-row input.descripcion { font-style: italic; } /* Estilo para la descripción de la fila de impuesto */

        /* Estilos para el contenedor de fecha y número de partida */
        .form-row-flex {
            display: flex;
            gap: 20px;
        }

        /* Media Queries para responsividad */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }
            .container {
                padding: 15px;
            }
            .form-header {
                margin-bottom: 20px;
                padding-bottom: 15px;
            }
            h2 {
                font-size: 1.3em;
            }
            .form-row-flex { /* Hace que la fecha y el número de partida se apilen */
                flex-direction: column;
                gap: 0;
            }
            .actions { /* Apila los botones de acción */
                flex-direction: column;
                align-items: stretch;
            }
            .actions button {
                width: 100%;
                margin-bottom: 10px;
            }
            .actions button:last-child {
                margin-bottom: 0;
            }
            .tax-options { /* Apila las opciones de impuesto */
                flex-direction: column;
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0; /* Elimina espacio exterior en móviles */
                background-color: #fff; /* Fondo sólido para mayor claridad */
            }
            .container {
                padding: 15px 10px;
                width: 100%;
                max-width: 100%;
                border-radius: 0; /* Bordes rectos para aprovechar cada píxel */
                box-shadow: none;
            }
            h2 {
                font-size: 1.2em;
            }
            .form-header img {
                max-width: 90%;
            }
            label, input, textarea, th, td, button {
                font-size: 0.9em;
            }
            .totals {
                font-size: 1em;
            }
            /* Optimización de la tabla para scroll táctil */
            .table-responsive {
                margin: 0 -10px; /* Expande la tabla hasta los bordes del cel */
                padding: 0 10px;
            }
        }
    </style>
    <!-- Carga las librerías localmente para evitar bloqueos de firewall empresarial -->
    <script src="js/jspdf.umd.min.js"></script>
    <script src="js/jspdf-autotable.min.js"></script>
</head>
<body>

<div class="container">
    <div class="form-header">
        <img src="logo.png" alt="Logo Empresa"> <!-- Logo del encabezado del formulario -->
        <h2>Sistema de Partidas Contables</h2>
    </div>

    <form id="partidaForm">
        <div class="form-row-flex"> <!-- Usar una clase para estilos responsivos -->
            <div class="form-group" style="flex: 1;">
                <label>Fecha:</label>
                <input type="date" id="fecha" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Número de Partida:</label>
                <input type="number" id="numeroPartida" value="" required>
            </div>
        </div>
        
        <div class="form-group">
            <label>Concepto General:</label>
            <textarea id="concepto" rows="2" required></textarea>
        </div>

        <h3>Detalle de la Partida</h3>
        <div class="table-responsive"> <!-- Contenedor para la tabla responsiva -->
            <table id="tablaDetalles">
                <thead>
                    <tr>
                        <th>Cuenta</th>
                        <th>Descripción</th>
                        <th style="width: 120px;">Debe</th>
                        <th style="width: 120px;">Haber</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filas dinámicas -->
                </tbody>
                <tfoot>
                    <tr class="totals">
                        <td colspan="2" style="text-align: right;">Totales:</td>
                        <td>L. <span id="totalDebe">0.00</span></td>
                        <td>L. <span id="totalHaber">0.00</span></td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="form-group">
            <label>Tipo de Impuesto:</label>
            <div class="tax-options">
                <input type="radio" id="tax15" name="taxType" value="15% Impuesto S/V" onchange="updateTaxRowDescription(this.value)">
                <label for="tax15">15% Impuesto S/V</label>
                <input type="radio" id="tax12_5" name="taxType" value="12.5% Impuesto S/R" onchange="updateTaxRowDescription(this.value)">
                <label for="tax12_5">12.5% Impuesto S/R</label>
                <input type="radio" id="taxExento" name="taxType" value="Exento" onchange="updateTaxRowDescription(this.value)" checked>
                <label for="taxExento">Exento</label>
            </div>
        </div>

        <div class="actions">
            <button type="button" class="btn-add" onclick="agregarFila()">+ Agregar Fila</button>
            <button type="submit" class="btn-submit">Generar PDF de Partida</button>
        </div>
        <div id="mensaje" class="error"></div>
    </form>
</div>

<script>
    const tabla = document.getElementById('tablaDetalles').getElementsByTagName('tbody')[0];

    function calcularTotales() {
        let totalDebe = 0;
        let totalHaber = 0;
        let sumOfNormalDebe = 0; // Suma de 'Debe' de filas que no son de impuesto ni de banco
        let taxRowHaberInput = null;
        let bankRowHaberInput = null;
        let currentTaxType = document.querySelector('input[name="taxType"]:checked').value;
        let divisor = 1;

        // Determinar la tasa de impuesto
        if (currentTaxType === '15% Impuesto S/V') {
            divisor = 1.15;
        } else if (currentTaxType === '12.5% Impuesto S/R') {
            divisor = 1.125;
        }

        // Primera pasada: Calcular sumOfNormalDebe e identificar filas especiales
        document.querySelectorAll('#tablaDetalles tbody tr').forEach(row => {
            const debeInput = row.querySelector('.debe');
            const haberInput = row.querySelector('.haber');
            if (row.classList.contains('tax-row')) {
                taxRowHaberInput = haberInput;
                row.querySelector('.debe').value = (0).toFixed(2); // Impuesto no va en el debe
            } else if (row.classList.contains('fixed-row')) { // Esta es la fila del banco
                bankRowHaberInput = haberInput;
                row.querySelector('.debe').value = (0).toFixed(2); // Banco no va en el debe
            } else { // Fila normal
                sumOfNormalDebe += parseFloat(debeInput.value || 0);
            }
        });

        // Calcular valores desglosados
        const valorBanco = sumOfNormalDebe / divisor;
        const valorImpuesto = sumOfNormalDebe - valorBanco;

        // Establecer el 'Haber' del impuesto
        if (taxRowHaberInput) {
            taxRowHaberInput.value = valorImpuesto.toFixed(2);
        }

        // Establecer el 'Haber' de la fila del banco
        if (bankRowHaberInput) {
            bankRowHaberInput.value = valorBanco.toFixed(2);
        }

        // Segunda pasada: Calcular totales finales para el pie de página
        totalDebe = 0;
        totalHaber = 0;
        document.querySelectorAll('#tablaDetalles tbody tr').forEach(row => {
            totalDebe += parseFloat(row.querySelector('.debe').value || 0);
            totalHaber += parseFloat(row.querySelector('.haber').value || 0);
        });

        document.getElementById('totalDebe').innerText = totalDebe.toFixed(2);
        document.getElementById('totalHaber').innerText = totalHaber.toFixed(2);
        
        const msg = document.getElementById('mensaje');
        if (totalDebe.toFixed(2) !== totalHaber.toFixed(2)) {
            msg.innerText = "REVISA VALORES PARTIDA DESCUADRADA";
        } else {
            msg.innerText = "";
        }
    }

    function agregarFila(cuentaVal = '', descVal = '', debeVal = 0, haberVal = 0, isFixed = false, isTax = false) {
        let index = -1; 

        // Lógica de posicionamiento: Las filas normales van antes que las de impuesto y banco
        if (!isFixed && !isTax) {
            for (let i = 0; i < tabla.rows.length; i++) {
                if (tabla.rows[i].classList.contains('fixed-row') || tabla.rows[i].classList.contains('tax-row')) {
                    index = i;
                    break;
                }
            }
        } else if (isTax) {
            // El impuesto va antes de la fila fija del banco
            for (let i = 0; i < tabla.rows.length; i++) {
                if (tabla.rows[i].classList.contains('fixed-row')) {
                    index = i;
                    break;
                }
            }
        }

        const row = tabla.insertRow(index);
        if (isFixed) row.classList.add('fixed-row');
        if (isTax) row.classList.add('tax-row');

        const descId = isTax ? 'id="taxDescriptionInput"' : '';

        row.innerHTML = `
            <td><input type="text" class="cuenta" placeholder="Código" value="${cuentaVal}" ${isFixed || isTax ? 'readonly' : ''} required></td>
            <td><input type="text" class="descripcion" ${descId} placeholder="Nombre cuenta" value="${descVal}" ${isFixed || isTax ? 'readonly' : ''} required></td>
            <td><div class="currency-field"><span>L.</span><input type="number" class="debe" value="${debeVal.toFixed(2)}" step="0.01" onchange="calcularTotales()" ${isFixed || isTax ? 'readonly' : ''}></div></td>
            <td><div class="currency-field"><span>L.</span><input type="number" class="haber" value="${haberVal.toFixed(2)}" step="0.01" onchange="calcularTotales()" ${isFixed || isTax ? 'readonly' : ''}></div></td>
            <td>${isFixed || isTax ? '' : '<button type="button" class="btn-remove" onclick="this.parentElement.parentElement.remove(); calcularTotales();">x</button>'}</td>
        `;
    }

    // La función updateTaxRowDescription ya llama a calcularTotales(), lo cual es correcto.
    function updateTaxRowDescription(description) {
        const taxDescriptionInput = document.getElementById('taxDescriptionInput');
        if (taxDescriptionInput) {
            taxDescriptionInput.value = description;
        }
        calcularTotales(); // Recalcular totales para actualizar el monto del impuesto
    }

    const partidaForm = document.getElementById('partidaForm');
    if (partidaForm) {
        partidaForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Acceso compatible con la versión UMD de jsPDF
        const { jsPDF } = window.jspdf || window;

        if (typeof jsPDF === 'undefined') {
            alert("Error: La librería jsPDF no se cargó correctamente. Verifica la conexión o el bloqueo del firewall.");
            return;
        }

        if (document.getElementById('mensaje').innerText.includes("DESCUADRADA")) { // Usar includes para ser más robusto
            alert("No se puede generar el PDF. La partida está descuadrada. Por favor, revisa los valores.");
            return; // Detener la ejecución si la partida no está balanceada
        }

        const doc = new jsPDF();

        // Cargar la imagen local y convertirla a Base64
        let logoDataUrl = '';
        let logoBackgroundDataUrl = ''; // Nueva variable para el logo de fondo del PDF
        try {
            const response = await fetch('logo.png'); // Cargar logo.png para el PDF
            const blob = await response.blob();
            logoDataUrl = await new Promise(resolve => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });

            // Cargar logo.jpeg para el fondo del PDF
            const responseJpeg = await fetch('logo.jpeg');
            const blobJpeg = await responseJpeg.blob();
            logoBackgroundDataUrl = await new Promise(resolve => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blobJpeg);
            });
        } catch (error) {
            console.error("Error al cargar el logo:", error);
            alert("No se pudo cargar los logos para el PDF. Asegúrate de que 'logo.png' y 'logo.jpeg' estén en la misma carpeta.");
            return; // Detener la generación del PDF si el logo no carga
        }

        const fecha = document.getElementById('fecha').value;
        const concepto = document.getElementById('concepto').value;
        const numeroPartida = document.getElementById('numeroPartida').value;

        // --- Fondo del PDF con logo.jpeg ---
        if (logoBackgroundDataUrl) {
            doc.setGState(new window.jspdf.GState({opacity: 0.1})); // Opacidad para el fondo
            const imgWidth = 150; // Ancho del logo de fondo
            const imgHeight = 150; // Alto del logo de fondo (es cuadrado)
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const xPos = (pageWidth - imgWidth) / 2;
            const yPos = (pageHeight - imgHeight) / 2;
            doc.addImage(logoBackgroundDataUrl, 'JPEG', xPos, yPos, imgWidth, imgHeight);
            doc.setGState(new window.jspdf.GState({opacity: 1})); // Restablecer opacidad para el contenido principal
        }

        // --- LOGO Y ENCABEZADO ---
        doc.addImage(logoDataUrl, 'PNG', 55, 10, 100, 12.5); // Usar logo.png en el PDF

        doc.setFontSize(16);
        doc.text("COMPROBANTE DE PARTIDA CONTABLE", 105, 35, { align: "center" }); // Título centrado (105 es la mitad de A4)
        
        doc.setFontSize(10);
        const labelX = 14;
        let currentY = 40; // Subimos un poco la posición inicial para ganar espacio

        // Calcular el ancho máximo de las etiquetas para una alineación limpia de los valores
        doc.setFont('helvetica', 'bold');
        const maxLabelWidth = Math.max(
            doc.getTextWidth('Fecha:'),
            doc.getTextWidth('N° de Partida:'),
            doc.getTextWidth('Concepto:')
        );
        const valueStartX = labelX + maxLabelWidth + 2; // +2 para un pequeño espacio entre etiqueta y valor

        // Fecha
        doc.setFont('helvetica', 'bold');
        doc.text(`Fecha:`, labelX, currentY);
        doc.setFont('helvetica', 'normal');
        doc.text(`${fecha}`, valueStartX, currentY);
        currentY += 4; // Espacio más reducido entre líneas

        // N° de Partida
        doc.setFont('helvetica', 'bold');
        doc.text(`N° de Partida:`, labelX, currentY);
        doc.setFont('helvetica', 'normal');
        doc.text(`${numeroPartida}`, valueStartX, currentY);
        currentY += 4; // Espacio más reducido entre líneas

        // Concepto
        doc.setFont('helvetica', 'bold');
        doc.text(`Concepto:`, labelX, currentY);
        doc.setFont('helvetica', 'normal');
        // Calculamos cuánto espacio ocupará el texto según el ancho disponible
        const anchoMaximo = 180 - (valueStartX - labelX);
        // Justificar el texto del concepto y usar maxWidth
        doc.text(concepto, valueStartX, currentY, { maxWidth: anchoMaximo, align: 'justify' });

        // Calculamos el espacio ocupado de forma más compacta (4.5 por línea sin margen extra)
        const lineasConcepto = doc.splitTextToSize(concepto, anchoMaximo);
        currentY += (lineasConcepto.length * 4.5); 

        // Recolectar datos de la tabla
        const filasData = [];
        document.querySelectorAll('#tablaDetalles tbody tr').forEach(fila => {
            filasData.push([
                fila.querySelector('.cuenta').value,
                fila.querySelector('.descripcion').value,
                `L. ${parseFloat(fila.querySelector('.debe').value || 0).toFixed(2)}`,
                `L. ${parseFloat(fila.querySelector('.haber').value || 0).toFixed(2)}`
            ]);
        });

        const tDebe = document.getElementById('totalDebe').innerText;
        const tHaber = document.getElementById('totalHaber').innerText;

        // Generar Tabla en PDF
        doc.autoTable({
            startY: currentY + 3, // Casi pegado al final del concepto
            head: [['Cuenta', 'Descripción', 'Debe', 'Haber']],
            body: filasData,
            foot: [['', 'TOTALES:', `L. ${tDebe}`, `L. ${tHaber}`]],
            theme: 'grid',
            headStyles: { fillColor: [41, 128, 185] }, // Estilos para el encabezado de la tabla
            footStyles: { fillColor: [240, 240, 240], textColor: [0, 0, 0], fontStyle: 'bold' }, // Estilos para el pie de la tabla
            didParseCell: function (data) {
                // Aplicar negrita a la cuenta y descripción de la última fila (Banco Central)
                if (data.section === 'body') {
                    // Columnas 0 (Cuenta) y 1 (Descripción)
                    if (data.column.index === 0 || data.column.index === 1) {
                        data.cell.styles.fontStyle = 'bold';
                    }
                }
            }
        });

        // --- SECCIÓN DE FIRMAS ---
        const finalY = doc.lastAutoTable.finalY + 40;
        const lineWidth = 50;
        
        // Calculamos el centro de cada línea para alinear el texto perfectamente
        const centro1 = 15 + (lineWidth / 2);
        const centro2 = 80 + (lineWidth / 2);
        const centro3 = 145 + (lineWidth / 2);

        doc.line(15, finalY, 15 + lineWidth, finalY);
        doc.setFontSize(8);
        doc.text("AUTORIZADO POR\nCONTABILIDAD", centro1, finalY + 5, { align: 'center' });

        doc.line(80, finalY, 80 + lineWidth, finalY);
        doc.text("REVISADO POR", centro2, finalY + 5, { align: 'center' });

        doc.line(145, finalY, 145 + lineWidth, finalY);
        doc.text("AUTORIZADO POR\nADMINISTRACION", centro3, finalY + 5, { align: 'center' });

        doc.save(`Partida_${fecha}_${numeroPartida}.pdf`);
        });
    }

    // Agregar dos filas por defecto
    agregarFila(); // Fila normal 1
    agregarFila(); // Fila normal 2
    agregarFila('27115', 'Exento', 0, 0, false, true); // Fila de impuesto, por defecto 'Exento'
    agregarFila('111020100000700', 'Banco Central de Honduras', 0, 0, true, false); // Fila del Banco al final
    calcularTotales(); // Calcular totales al inicio
    updateTaxRowDescription(document.querySelector('input[name="taxType"]:checked').value); // Inicializar la descripción del impuesto
</script>
</body>
</html>
