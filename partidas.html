<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.ico" type="image/x-icon">
    <title>Nueva Partida Contable</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            background-color: #002147;
            min-height: 100vh;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('logo.jpeg') no-repeat center center;
            background-size: 40%;
            filter: blur(10px) opacity(0.15);
            z-index: -1;
        }
        .container { 
            max-width: 950px; 
            margin: auto; 
            background: rgba(255, 255, 255, 0.98); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.4); 
            border-top: 8px solid #002147;
            animation: fadeIn 0.8s ease-out;
        }
        .form-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }
        .form-header img { max-width: 350px; margin-bottom: 15px; }
        h2 { color: #2c3e50; margin: 0; font-size: 1.5em; text-transform: uppercase; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { 
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; 
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus {
            outline: none; border-color: #002147; box-shadow: 0 0 8px rgba(0,33,71,0.2);
        }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f8f9fa; }
        .actions { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-submit { background-color: #007bff; color: white; font-size: 16px; }
        .btn-remove { background-color: #dc3545; color: white; padding: 5px 10px; }
        .totals { font-weight: bold; font-size: 1.1em; }
        .error { color: red; margin-top: 10px; }
        .currency-field { display: flex; align-items: center; gap: 4px; }
        .currency-field span { font-weight: bold; color: #555; }
        input.cuenta, input.descripcion { font-weight: bold; }
        .tax-options { display: flex; gap: 20px; margin-top: 10px; }
        .tax-options input[type="radio"] { width: 16px; height: 16px; cursor: pointer; vertical-align: middle; }

        .nav-container { max-width: 950px; margin: 0 auto 20px auto; display: flex; gap: 10px; align-items: center; }
        .btn-nav { text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 0.9em; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.3s; }
        .btn-nav-menu { background-color: #6c757d; color: white; }
        .btn-nav-menu:hover { background-color: #5a6268; transform: translateY(-1px); }
        .btn-nav-active { background-color: #002147; color: white; cursor: default; }
        .btn-nav-inactive { background-color: #f1f3f5; color: #333; border: 1px solid #ccc; }
        .btn-nav-inactive:hover { background-color: #e9ecef; }
    </style>
    <script src="js/jspdf.umd.min.js"></script>
    <script src="js/jspdf-autotable.min.js"></script>
</head>
<body>
<div class="nav-container">
    <a href="index.html" class="btn-nav btn-nav-menu">← Ir al Menú</a>
</div>

<div class="container">
    <div class="form-header">
        <img src="logo.png" alt="Logo Empresa">
        <h2>Sistema de Partidas Contables</h2>
    </div>
    <form id="partidaForm">
        <div style="display: flex; gap: 20px;">
            <div class="form-group" style="flex: 1;">
                <label>Fecha:</label>
                <input type="date" id="fecha" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Número de Partida:</label>
                <input type="number" id="numeroPartida" required>
            </div>
        </div>
        <div class="form-group">
            <label>Concepto General:</label>
            <textarea id="concepto" rows="2" required></textarea>
        </div>
        <h3>Detalle de la Partida</h3>
        <table id="tablaDetalles">
            <thead>
                <tr>
                    <th>Cuenta</th>
                    <th>Descripción</th>
                    <th style="width: 120px;">Debe</th>
                    <th style="width: 120px;">Haber</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr class="totals">
                    <td colspan="2" style="text-align: right;">Totales:</td>
                    <td>L. <span id="totalDebe">0.00</span></td>
                    <td>L. <span id="totalHaber">0.00</span></td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
        <div class="form-group">
            <label>Tipo de Impuesto:</label>
            <div class="tax-options">
                <input type="radio" id="tax15" name="taxType" value="15% Impuesto S/V" onchange="updateTaxRowDescription(this.value)">
                <label for="tax15">15% Impuesto S/V</label>
                <input type="radio" id="tax12_5" name="taxType" value="12.5% Impuesto S/R" onchange="updateTaxRowDescription(this.value)">
                <label for="tax12_5">12.5% Impuesto S/R</label>
                <input type="radio" id="taxExento" name="taxType" value="Exento" onchange="updateTaxRowDescription(this.value)" checked>
                <label for="taxExento">Exento</label>
            </div>
        </div>
        <div class="actions">
            <button type="button" class="btn-add" onclick="agregarFila()">+ Agregar Fila</button>
            <button type="submit" class="btn-submit">Generar PDF de Partida</button>
        </div>
        <div id="mensaje" class="error"></div>
    </form>
</div>

<script>
    const tabla = document.getElementById('tablaDetalles').getElementsByTagName('tbody')[0];

    function calcularTotales() {
        let sumOfNormalDebe = 0;
        let taxRowHaberInput = null;
        let bankRowHaberInput = null;
        let currentTaxType = document.querySelector('input[name="taxType"]:checked').value;
        let divisor = (currentTaxType === '15% Impuesto S/V') ? 1.15 : (currentTaxType === '12.5% Impuesto S/R' ? 1.125 : 1);

        document.querySelectorAll('#tablaDetalles tbody tr').forEach(row => {
            const debeInput = row.querySelector('.debe');
            const haberInput = row.querySelector('.haber');
            if (row.classList.contains('tax-row')) {
                taxRowHaberInput = haberInput;
            } else if (row.classList.contains('fixed-row')) {
                bankRowHaberInput = haberInput;
            } else {
                sumOfNormalDebe += parseFloat(debeInput.value || 0);
            }
        });

        const valorBanco = sumOfNormalDebe / divisor;
        const valorImpuesto = sumOfNormalDebe - valorBanco;

        if (taxRowHaberInput) taxRowHaberInput.value = valorImpuesto.toFixed(2);
        if (bankRowHaberInput) bankRowHaberInput.value = valorBanco.toFixed(2);

        let totalDebe = 0, totalHaber = 0;
        document.querySelectorAll('#tablaDetalles tbody tr').forEach(row => {
            totalDebe += parseFloat(row.querySelector('.debe').value || 0);
            totalHaber += parseFloat(row.querySelector('.haber').value || 0);
        });

        document.getElementById('totalDebe').innerText = totalDebe.toFixed(2);
        document.getElementById('totalHaber').innerText = totalHaber.toFixed(2);
        document.getElementById('mensaje').innerText = (totalDebe.toFixed(2) !== totalHaber.toFixed(2)) ? "REVISA VALORES PARTIDA DESCUADRADA" : "";
    }

    function agregarFila(cuentaVal = '', descVal = '', debeVal = 0, haberVal = 0, isFixed = false, isTax = false) {
        let index = -1; 
        if (!isFixed && !isTax) {
            for (let i = 0; i < tabla.rows.length; i++) {
                if (tabla.rows[i].classList.contains('fixed-row') || tabla.rows[i].classList.contains('tax-row')) { index = i; break; }
            }
        } else if (isTax) {
            for (let i = 0; i < tabla.rows.length; i++) {
                if (tabla.rows[i].classList.contains('fixed-row')) { index = i; break; }
            }
        }

        const row = tabla.insertRow(index);
        if (isFixed) row.classList.add('fixed-row');
        if (isTax) row.classList.add('tax-row');

        row.innerHTML = `
            <td><input type="text" class="cuenta" value="${cuentaVal}" ${isFixed || isTax ? 'readonly' : ''} required></td>
            <td><input type="text" class="descripcion" ${isTax ? 'id="taxDescriptionInput"' : ''} value="${descVal}" ${isFixed || isTax ? 'readonly' : ''} required></td>
            <td><div class="currency-field"><span>L.</span><input type="number" class="debe" value="${debeVal.toFixed(2)}" step="0.01" min="0" oninput="calcularTotales()" ${isFixed || isTax ? 'readonly' : ''}></div></td>
            <td><div class="currency-field"><span>L.</span><input type="number" class="haber" value="${haberVal.toFixed(2)}" step="0.01" min="0" oninput="calcularTotales()" ${isFixed || isTax ? 'readonly' : ''}></div></td>
            <td>${isFixed || isTax ? '' : '<button type="button" class="btn-remove" onclick="this.parentElement.parentElement.remove(); calcularTotales();">x</button>'}</td>
        `;
    }

    function updateTaxRowDescription(description) {
        if (document.getElementById('taxDescriptionInput')) document.getElementById('taxDescriptionInput').value = description;
        calcularTotales();
    }

    document.getElementById('partidaForm').onsubmit = async (e) => {
        e.preventDefault();
        if (document.getElementById('mensaje').innerText) { alert("La partida está descuadrada."); return; }
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const getBase64FromUrl = (url) => new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement("canvas");
                canvas.width = img.width; canvas.height = img.height;
                canvas.getContext("2d").drawImage(img, 0, 0);
                resolve(canvas.toDataURL("image/png"));
            };
            img.onerror = () => reject(new Error("Error imagen: " + url));
            img.src = url;
        });

        const logoDataUrl = await getBase64FromUrl('logo.png');
        const logoBgUrl = await getBase64FromUrl('logo odoo.png');

        doc.addImage(logoBgUrl, 'PNG', 30, 70, 150, 150);
        doc.addImage(logoDataUrl, 'PNG', 55, 10, 100, 12.5);

        doc.setFontSize(16);
        doc.text("COMPROBANTE DE PARTIDA CONTABLE", 105, 35, { align: "center" });
        
        const fecha = document.getElementById('fecha').value;
        const concepto = document.getElementById('concepto').value;
        const num = document.getElementById('numeroPartida').value;

        doc.setFontSize(10);
        doc.text(`Fecha: ${fecha}`, 14, 45);
        doc.text(`N° de Partida: ${num}`, 14, 50);
        doc.text(`Concepto: ${concepto}`, 14, 55, { maxWidth: 180 });

        const filasData = [];
        document.querySelectorAll('#tablaDetalles tbody tr').forEach(fila => {
            filasData.push([
                fila.querySelector('.cuenta').value,
                fila.querySelector('.descripcion').value,
                `L. ${parseFloat(fila.querySelector('.debe').value || 0).toFixed(2)}`,
                `L. ${parseFloat(fila.querySelector('.haber').value || 0).toFixed(2)}`
            ]);
        });

        doc.autoTable({
            startY: 70,
            head: [['Cuenta', 'Descripción', 'Debe', 'Haber']],
            body: filasData,
            foot: [['', 'TOTALES:', `L. ${document.getElementById('totalDebe').innerText}`, `L. ${document.getElementById('totalHaber').innerText}`]],
            theme: 'grid',
            headStyles: { fillColor: [44, 62, 80] },
            footStyles: { fillColor: [240, 240, 240], textColor: [0, 0, 0], fontStyle: 'bold' }
        });

        const finalY = doc.lastAutoTable.finalY + 40;
        doc.line(15, finalY, 65, finalY);
        doc.text("AUTORIZADO POR", 40, finalY + 5, { align: 'center' });
        doc.line(80, finalY, 130, finalY);
        doc.text("REVISADO POR", 105, finalY + 5, { align: 'center' });
        doc.line(145, finalY, 195, finalY);
        doc.text("ADMINISTRACION", 170, finalY + 5, { align: 'center' });

        doc.save(`Partida_${num}.pdf`);
    };

    agregarFila(); agregarFila();
    agregarFila('27115', 'Exento', 0, 0, false, true);
    agregarFila('111020100000700', 'Banco Central de Honduras', 0, 0, true, false);
    calcularTotales();
</script>
</body>
</html>
